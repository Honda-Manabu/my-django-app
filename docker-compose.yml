#version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=HM31764713DB

  web:
    build: .
    #extra_hosts:
    #  - "email-smtp.ap-northeast-1.amazonaws.com:15.197.202.162"
    env_file:
      - .env
    command: >
      sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000 --insecure"
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
    depends_on:
      - db
    environment:
      - DATABASE_HOST=db  # settings.py の os.environ.get を指定
    #  - DATABASE_URL=postgres://your_user_name:your_password@db:5432/your_db_name

volumes:
  postgres_data:
