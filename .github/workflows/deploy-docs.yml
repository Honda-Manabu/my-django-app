name: Deploy Documentation / App

on:
  push:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'デプロイ対象を選択してください'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'staging'
          - 'production'

jobs:
  deploy-staging:
    environment: Staging
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target_env == 'all' || inputs.target_env == 'staging')) ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip staging]'))
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY2 }}
          script: |
            cd ${{ vars.REMOTE_PATH }}
            git fetch origin ${{ github.ref_name }}
            COMPOSE_CHANGED=$(git diff HEAD origin/${{ github.ref_name }} --name-only | grep "docker-compose.yml" || true)
            git pull origin ${{ github.ref_name }}
            sudo chown -R bitnami:bitnami .
            if [ -n "$COMPOSE_CHANGED" ]; then
              echo ">>> [Auto-detected] docker-compose.yml modified. Running 'docker compose up -d'..."
              docker compose up -d
            else
              echo ">>> [Auto-detected] No changes in docker-compose.yml."
            fi
            docker compose exec -T web pip install -r requirements.txt
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput
            docker compose exec -T web touch my_django_project/wsgi.py
            if [ -z "$COMPOSE_CHANGED" ]; then
              echo ">>> Restarting web container..."
              docker compose restart web
            fi
            sudo /opt/bitnami/ctlscript.sh restart apache

  deploy-production:
    environment: Production
    runs-on: ubuntu-latest 
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target_env == 'all' || inputs.target_env == 'production')) ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[only staging]'))
    steps:
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY1 }}
          script: |
            cd ${{ vars.REMOTE_PATH }}
            git fetch origin ${{ github.ref_name }}
            COMPOSE_CHANGED=$(git diff HEAD origin/${{ github.ref_name }} --name-only | grep "docker-compose.yml" || true)
            git pull origin ${{ github.ref_name }}
            sudo chown -R bitnami:bitnami .
            if [ -n "$COMPOSE_CHANGED" ]; then
              echo ">>> [Auto-detected] docker-compose.yml modified. Running 'docker compose up -d'..."
              docker compose up -d
            else
              echo ">>> [Auto-detected] No changes in docker-compose.yml."
            fi
            docker compose exec -T web pip install -r requirements.txt
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput
            docker compose exec -T web touch my_django_project/wsgi.py
            if [ -z "$COMPOSE_CHANGED" ]; then
              echo ">>> Restarting web container..."
              docker compose restart web
            fi
            sudo /opt/bitnami/ctlscript.sh restart apache